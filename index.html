<!doctype html>
<html lang="en">
  <head>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#111c2e" />
    <title>Walang Brownout Appliances</title>
    <meta name="description" content="Walang Brownout Appliances inventory system - monitor appliance stock, record stock movements and act on reorder alerts." />
    <style>
      /* Loading screen shown until the app is ready (removed by src/main.js). */
      #ims-splash {
        position: fixed; inset: 0; z-index: 9999; display: grid; place-items: center;
        background: #111c2e; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; /* system font: no swap, no layout shift */
        transition: opacity .2s ease, visibility .2s ease;
      }
      #ims-splash.ims-splash--out { opacity: 0; visibility: hidden; }
      /* The logo is hidden at once while the dark backdrop fades: a centred box that
         is still visible would count as a layout shift when the page behind it
         becomes taller than the screen. */
      #ims-splash.ims-splash--out .ims-s-wrap { visibility: hidden; }
      #ims-splash .ims-s-wrap { display: flex; flex-direction: column; align-items: center; }
      #ims-splash .ims-s-mark { position: relative; width: 112px; height: 112px; }
      #ims-splash .ims-s-mark svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
      #ims-splash .ims-s-name { margin-top: 18px; padding-left: .1em; color: #fff; font-weight: 800; font-size: 20px; letter-spacing: .1em; }
      #ims-splash .ims-s-sub { margin-top: 4px; color: rgba(255,255,255,.6); font-size: 13px; letter-spacing: .03em; }
      #ims-splash .ims-s-track { margin-top: 22px; width: 140px; height: 2px; border-radius: 2px; background: rgba(255,255,255,.1); overflow: hidden; }
      #ims-splash .ims-s-track i { display: block; width: 40%; height: 100%; background: #38bdf8; animation: ims-s-load 1.1s ease-in-out infinite; }

      /* full build-up animation (first visit in this tab) */
      #ims-splash.ims-splash--full .ims-s-badge { opacity: 0; will-change: transform, opacity; animation: ims-s-badge .5s cubic-bezier(.2,.9,.3,1.25) forwards; }
      #ims-splash.ims-splash--full .ims-s-ring  { opacity: 0; transform-origin: 50% 51.5%; will-change: transform, opacity; animation: ims-s-ring .6s cubic-bezier(.2,.8,.2,1) .25s forwards; }
      #ims-splash.ims-splash--full .ims-s-bolt  { opacity: 0; transform-origin: 55% 12%; will-change: transform, opacity; animation: ims-s-bolt .45s cubic-bezier(.3,1.4,.5,1) .6s forwards; }
      #ims-splash.ims-splash--full .ims-s-name,
      #ims-splash.ims-splash--full .ims-s-sub { opacity: 0; animation: ims-s-text .5s ease-out forwards; }
      #ims-splash.ims-splash--full .ims-s-name { animation-delay: .1s; }
      #ims-splash.ims-splash--full .ims-s-sub  { animation-delay: .25s; }

      @keyframes ims-s-badge { from { opacity: 0; transform: scale(.7); } to { opacity: 1; transform: none; } }
      @keyframes ims-s-ring  { from { opacity: 0; transform: rotate(-120deg) scale(.8); } to { opacity: 1; transform: none; } }
      @keyframes ims-s-bolt  { from { opacity: 0; transform: translateY(-18%) scaleY(.4); } 60% { opacity: 1; transform: translateY(2%) scaleY(1.06); } to { opacity: 1; transform: none; } }
      @keyframes ims-s-text { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
      @keyframes ims-s-load { from { transform: translateX(-100%); } to { transform: translateX(250%); } }

      @media (prefers-reduced-motion: reduce) {
        #ims-splash * { animation: none !important; opacity: 1 !important; transform: none !important; }
        #ims-splash .ims-s-track { display: none; }
      }
    </style>
  </head>
  <body>
    <div id="ims-splash" role="status" aria-label="Loading Walang Brownout Appliances">
      <div class="ims-s-wrap">
        <div class="ims-s-mark" aria-hidden="true">
          <svg class="ims-s-badge" viewBox="0 0 64 64"><rect x="4" y="4" width="56" height="56" rx="15" fill="#1d4ed8" /></svg>
          <svg class="ims-s-ring" viewBox="0 0 64 64"><circle cx="32" cy="33" r="19" fill="none" stroke="#bfdbfe" stroke-width="4.5" stroke-linecap="round" stroke-dasharray="94 25.4" transform="rotate(-63 32 33)" /></svg>
          <svg class="ims-s-bolt" viewBox="0 0 64 64"><polygon points="35.5,8 20,35 30,35 27.5,57 44,28 34.5,28" fill="#fbbf24" /><polygon points="35.5,8 20,35 30,35 29,42 44,28 34.5,28" fill="#fcd34d" /></svg>
        </div>
        <div class="ims-s-name">WALANG BROWNOUT</div>
        <div class="ims-s-sub">Appliances</div>
        <div class="ims-s-track"><i></i></div>
      </div>
    </div>
    <script>
      // Full animation once per tab; later reloads just show the logo until the app is ready.
      (function () {
        var el = document.getElementById('ims-splash');
        var seen = false;
        try { seen = sessionStorage.getItem('ims_splash_seen') === '1'; sessionStorage.setItem('ims_splash_seen', '1'); } catch (e) {}
        var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        if (!seen && !reduce) el.className = 'ims-splash--full';
        window.__imsSplash = { start: Date.now(), full: !seen && !reduce };
        // Never let the loading screen get stuck.
        setTimeout(function () { el.classList.add('ims-splash--out'); }, 10000);
      })();
    </script>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
